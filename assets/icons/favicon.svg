<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nimbusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado moderno (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#nimbusBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Sol radiante sutil detras de la nube -->
  <circle cx="43" cy="22" r="9" fill="url(#sunGlow)" opacity="0.9" filter="url(#glow)" />
  
  <!-- Nube Nimbus estilizada -->
  <path d="M44 44 H21 A11 11 0 0 1 18.2 22.4 A15 15 0 0 1 43.5 24.5 A10 10 0 0 1 44 44 Z" 
        fill="url(#cloudGrad)" 
        stroke="#ffffff" 
        stroke-width="1.2" 
        stroke-linejoin="round" />

  <!-- Acento de precision meteorologica (Curva de viento / onda atmosferica) -->
  <path d="M22 49 C28 47, 34 51, 42 49" 
        stroke="#38bdf8" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        fill="none" />
</svg>
